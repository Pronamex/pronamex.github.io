name: Compilar Documentación PRONAMEX
on:
  push:
    paths:
      - 'Procesos/**/*.docx'
      - 'Procesos/**/*.vsdx'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar LibreOffice y Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice pandoc poppler-utils

      - name: Procesar archivos DOCX (PDF y TXT)
        run: |
          shopt -s nullglob
          for file in Procesos/*.docx; do
            # Generar PDF
            libreoffice --headless --convert-to pdf "$file" --outdir Procesos/
            # Generar TXT sin formato para Botpress
            pandoc "$file" -t plain -o "${file%.docx}.txt"
          done

      - name: Procesar archivos VSDX (PDF)
        run: |
          shopt -s nullglob
          for file in Procesos/*.vsdx; do
            libreoffice --headless --convert-to pdf "$file" --outdir Procesos/
            # Opcional: Extraer texto del diagrama si el chatbot lo requiere
            pdftotext "Procesos/$(basename "${file%.vsdx}.pdf")" "${file%.vsdx}.txt"
          done

      - name: Guardar y publicar versiones
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add Procesos/*.pdf Procesos/*.txt
          git commit -m "Auto-generar versiones PDF y TXT de procesos" || echo "Sin cambios"
          git push
